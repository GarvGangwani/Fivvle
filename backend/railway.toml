# Railway config for the FastAPI backend (set service Root Directory = backend).
# Dashboard path: Settings → Config-as-code → /backend/railway.toml

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
