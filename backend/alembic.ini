# Alembic configuration.
#
# DATABASE_URL is set programmatically in alembic/env.py from app.config
# (reads from .env in dev, environment variables in production).
# Never hardcode the URL here — that would put credentials in source control.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Chronological filename template so migrations sort by date in the filesystem.
# Example: 20260511_1430_abc123_initial_schema.py
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# URL intentionally blank — injected at runtime by env.py via app.config.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
