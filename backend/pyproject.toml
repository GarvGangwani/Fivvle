[project]
name = "fivvle-backend"
version = "0.1.0"
description = "Fivvle API (FastAPI modular monolith)"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.136.1",
    "uvicorn[standard]==0.46.0",
    "gunicorn==26.0.0",
    "sqlalchemy[asyncio]==2.0.49",
    "asyncpg==0.31.0",
    "alembic==1.18.4",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "instructor==1.15.1",
    "anthropic==0.100.0",
    "groq==1.2.0",
    "firebase-admin==7.4.0",
    "google-auth>=2.30,<3",
    "httpx==0.28.1",
    "structlog==25.5.0",
    "sentry-sdk[fastapi]==2.59.0",
    "tenacity==9.1.4",
    "python-multipart==0.0.28",
    "email-validator>=2.3.0",
    "tavily-python>=0.7.24",
    "praw>=7.8.1",
    "pytrends>=4.9.2",
    "slowapi==0.1.9",
    "openai==2.36.0",
]

[dependency-groups]
dev = [
    "ruff==0.15.12",
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
    "mypy==2.0.0",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
